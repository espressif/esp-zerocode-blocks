id: wall-switch-1gang
name: Wall Switch 1-Gang (relay)
description: In-wall relay module controlled via Matter Mounted On/Off Control + physical button
keywords: [wall, switch, relay, mounted, in-wall]
frameworks: [matter]

instances:
  - block: drivers/relay
    prefix: LOAD
    cfg:
      gpio: 7
      active_level: 1
      param_id: APP_DRIVER_PARAM_POWER

  - block: drivers/button
    prefix: WALL_BTN
    cfg:
      gpio: 9
      active_level: 0
      target_param: APP_DRIVER_PARAM_POWER

  - block: device_types/wall_switch_module
    prefix: SWITCH
    cfg:
      power_param: APP_DRIVER_PARAM_POWER

  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  # ── Long-press factory reset (button hold 5 s) ─────────────────
  - block: behaviors/factory_reset_long_press
    prefix: FR
    cfg:
      gpio: 9
      active_level: 0
      hold_time_ms: 5000

  # ── State persistence (survives reboot) ───────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_POWER
    cfg:
      target_param: APP_DRIVER_PARAM_POWER
      nvs_namespace: app
      nvs_key: power

  - include: console-diagnostics

  # ── Console set/get for actuator params ───────────────────────────
  - block: behaviors/console_param_cmd
    prefix: CMD_POWER
    cfg:
      command_name: power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_POWER
    cfg:
      command_name: get-power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool

  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Wall Switch

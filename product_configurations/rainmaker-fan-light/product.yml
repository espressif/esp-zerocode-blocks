id: rainmaker-fan-light
name: RainMaker Fan + Light
description: Cloud-connected ceiling fan with integrated light — controlled via the ESP RainMaker app (first RainMaker-only product; exercises the rainmaker_* bindings on two device types)
keywords: [rainmaker, cloud, fan, light, ceiling]
frameworks: [rainmaker]

instances:
  # ── Hardware ────────────────────────────────────────────────
  - block: drivers/relay
    prefix: LIGHT
    cfg:
      gpio: 7
      active_level: 1
      param_id: APP_DRIVER_PARAM_POWER

  - block: drivers/fan_pwm
    prefix: FAN
    cfg:
      gpio: 5
      ledc_channel: 0
      ledc_timer: 0
      freq_hz: 25000
      speed_param: APP_DRIVER_PARAM_FAN_SPEED

  # ── Device types (RainMaker bindings) ───────────────────────
  - block: device_types/light
    prefix: LIGHT
    cfg:
      power_param: APP_DRIVER_PARAM_POWER
      label: Light

  - block: device_types/fan
    prefix: FAN
    cfg:
      speed_param: APP_DRIVER_PARAM_FAN_SPEED
      label: Fan

  - include: baseline-connectivity

  # ── Status LED — provisioning/connectivity feedback ─────────
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1
  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  # ── State persistence (survives reboot) ─────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_POWER
    cfg:
      target_param: APP_DRIVER_PARAM_POWER
      nvs_namespace: app
      nvs_key: power
  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_SPEED
    cfg:
      target_param: APP_DRIVER_PARAM_FAN_SPEED
      nvs_namespace: app
      nvs_key: fanspeed

  - include: console-diagnostics

  - block: behaviors/console_param_cmd
    prefix: CMD_POWER
    cfg:
      command_name: power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_POWER
    cfg:
      command_name: get-power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_SPEED
    cfg:
      command_name: fan-speed
      target_param: APP_DRIVER_PARAM_FAN_SPEED
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_SPEED
    cfg:
      command_name: get-fan-speed
      target_param: APP_DRIVER_PARAM_FAN_SPEED
      value_kind: u8

  - include: diagnostics-core

partition_table: 4mb

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode RainMaker Fan Light

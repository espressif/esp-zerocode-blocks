id: outdoor-flood-motion
name: Outdoor Flood Light + Motion Sensor
description: Combo product — outdoor RGB flood light + PIR motion sensor in one Matter node
keywords: [outdoor, flood, motion, PIR, security, combo]
frameworks: [matter]

instances:
  - block: drivers/pwm_rgb
    prefix: FLOOD
    cfg:
      red_gpio: 4
      green_gpio: 5
      blue_gpio: 6
      red_channel: 0
      green_channel: 1
      blue_channel: 2
      ledc_timer: 0
      freq_hz: 5000
      power_param: APP_DRIVER_PARAM_LIGHT_POWER
      brightness_param: APP_DRIVER_PARAM_LIGHT_BRIGHTNESS
      hue_param: APP_DRIVER_PARAM_LIGHT_HUE
      saturation_param: APP_DRIVER_PARAM_LIGHT_SAT

  - block: drivers/gpio_input_sensor
    prefix: PIR
    cfg:
      gpio: 8
      pull: pulldown
      active_level: 1
      poll_interval_ms: 250
      target_param: APP_DRIVER_PARAM_OCCUPIED

  - block: device_types/color_light
    prefix: FLOOD_EP
    cfg:
      power_param: APP_DRIVER_PARAM_LIGHT_POWER
      brightness_param: APP_DRIVER_PARAM_LIGHT_BRIGHTNESS
      hue_param: APP_DRIVER_PARAM_LIGHT_HUE
      saturation_param: APP_DRIVER_PARAM_LIGHT_SAT

  - block: device_types/occupancy_sensor
    prefix: OCC_EP
    cfg:
      occupied_param: APP_DRIVER_PARAM_OCCUPIED

  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  # ── State persistence (survives reboot) ───────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_LPOWER
    cfg:
      target_param: APP_DRIVER_PARAM_LIGHT_POWER
      nvs_namespace: app
      nvs_key: lpower

  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_LBRI
    cfg:
      target_param: APP_DRIVER_PARAM_LIGHT_BRIGHTNESS
      nvs_namespace: app
      nvs_key: lbri

  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_LHUE
    cfg:
      target_param: APP_DRIVER_PARAM_LIGHT_HUE
      nvs_namespace: app
      nvs_key: lhue

  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_LSAT
    cfg:
      target_param: APP_DRIVER_PARAM_LIGHT_SAT
      nvs_namespace: app
      nvs_key: lsat

  - include: console-diagnostics

  # ── Console set/get for actuator params ───────────────────────────
  - block: behaviors/console_param_cmd
    prefix: CMD_LPOWER
    cfg:
      command_name: lpower
      target_param: APP_DRIVER_PARAM_LIGHT_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_LPOWER
    cfg:
      command_name: get-lpower
      target_param: APP_DRIVER_PARAM_LIGHT_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_LBRI
    cfg:
      command_name: lbri
      target_param: APP_DRIVER_PARAM_LIGHT_BRIGHTNESS
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_LBRI
    cfg:
      command_name: get-lbri
      target_param: APP_DRIVER_PARAM_LIGHT_BRIGHTNESS
      value_kind: u8
  - block: behaviors/console_param_cmd
    prefix: CMD_LHUE
    cfg:
      command_name: lhue
      target_param: APP_DRIVER_PARAM_LIGHT_HUE
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_LHUE
    cfg:
      command_name: get-lhue
      target_param: APP_DRIVER_PARAM_LIGHT_HUE
      value_kind: u8
  - block: behaviors/console_param_cmd
    prefix: CMD_LSAT
    cfg:
      command_name: lsat
      target_param: APP_DRIVER_PARAM_LIGHT_SAT
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_LSAT
    cfg:
      command_name: get-lsat
      target_param: APP_DRIVER_PARAM_LIGHT_SAT
      value_kind: u8

  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Outdoor Flood + Motion

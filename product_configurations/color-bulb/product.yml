id: color-bulb
name: Color Bulb (RGB)
description: 3-channel PWM RGB color bulb (Matter Extended Color Light)
keywords: [color bulb, rgb, smart bulb]
frameworks: [matter]

instances:
  - block: drivers/pwm_rgb
    prefix: BULB
    cfg:
      red_gpio: 4
      green_gpio: 5
      blue_gpio: 6
      red_channel: 0
      green_channel: 1
      blue_channel: 2
      ledc_timer: 0
      freq_hz: 5000
      power_param: APP_DRIVER_PARAM_POWER
      brightness_param: APP_DRIVER_PARAM_BRIGHTNESS
      hue_param: APP_DRIVER_PARAM_HUE
      saturation_param: APP_DRIVER_PARAM_SATURATION

  - block: device_types/color_light
    prefix: BULB
    cfg:
      power_param: APP_DRIVER_PARAM_POWER
      brightness_param: APP_DRIVER_PARAM_BRIGHTNESS
      hue_param: APP_DRIVER_PARAM_HUE
      saturation_param: APP_DRIVER_PARAM_SATURATION

  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  # ── State persistence (survives reboot) ───────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_POWER
    cfg:
      target_param: APP_DRIVER_PARAM_POWER
      nvs_namespace: app
      nvs_key: power

  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_BRIGHTNESS
    cfg:
      target_param: APP_DRIVER_PARAM_BRIGHTNESS
      nvs_namespace: app
      nvs_key: brightness

  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_HUE
    cfg:
      target_param: APP_DRIVER_PARAM_HUE
      nvs_namespace: app
      nvs_key: hue

  - block: behaviors/nvs_persist_u8
    prefix: PERSIST_SAT
    cfg:
      target_param: APP_DRIVER_PARAM_SATURATION
      nvs_namespace: app
      nvs_key: sat

  - include: console-diagnostics

  # ── Console set/get for actuator params ───────────────────────────
  - block: behaviors/console_param_cmd
    prefix: CMD_POWER
    cfg:
      command_name: power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_POWER
    cfg:
      command_name: get-power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_BRIGHTNESS
    cfg:
      command_name: brightness
      target_param: APP_DRIVER_PARAM_BRIGHTNESS
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_BRIGHTNESS
    cfg:
      command_name: get-brightness
      target_param: APP_DRIVER_PARAM_BRIGHTNESS
      value_kind: u8
  - block: behaviors/console_param_cmd
    prefix: CMD_HUE
    cfg:
      command_name: hue
      target_param: APP_DRIVER_PARAM_HUE
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_HUE
    cfg:
      command_name: get-hue
      target_param: APP_DRIVER_PARAM_HUE
      value_kind: u8
  - block: behaviors/console_param_cmd
    prefix: CMD_SAT
    cfg:
      command_name: sat
      target_param: APP_DRIVER_PARAM_SATURATION
      value_kind: u8
  - block: behaviors/console_param_get
    prefix: GET_SAT
    cfg:
      command_name: get-sat
      target_param: APP_DRIVER_PARAM_SATURATION
      value_kind: u8

  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Color Bulb

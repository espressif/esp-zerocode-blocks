id: ble-mesh-switch
name: BLE Mesh Switch
description: BLE Mesh wireless switch that also forms the network — a dimmer remote and a scene button publishing Generic OnOff/Level to the shared group, plus the provisioner behavior that adds every ZeroCode mesh node it hears and binds its models (first ble_mesh CONTROLLER product; exercises the client-side bindings and the provisioner)
keywords: [ble mesh, bluetooth, switch, dimmer, remote, provisioner]
frameworks: [ble_mesh]

instances:
  # ── Hardware: one physical scene button; the dimmer inputs are
  #    console-driven in this reference (wire a rotary encoder for a
  #    physical dimmer). ──
  - block: drivers/momentary_button
    prefix: SCENE_BTN
    cfg:
      gpio: 9
      active_level: 0

  # ── Controller device types (BLE Mesh client bindings) ──────
  - block: device_types/dimmer_remote
    prefix: DIMMER
    cfg:
      power_param: APP_DRIVER_PARAM_POWER
      level_param: APP_DRIVER_PARAM_BRIGHTNESS

  - block: device_types/scene_button
    prefix: SCENE
    cfg:
      position_param: APP_DRIVER_PARAM_SWITCH_POSITION

  # ── This device forms the mesh: it provisions every ZeroCode mesh
  #    node it hears and binds their servers AND clients. One per
  #    network. ──
  - block: behaviors/ble_mesh_provisioner
    prefix: PROV
    cfg:
      group_addr: 49152
      max_nodes: 8

  # ── Baseline behaviors (Wi-Fi ones omitted — no Wi-Fi) ──────
  - block: behaviors/factory_reset_power_cycle
    prefix: FRPC
    cfg:
      count_threshold: 5
      stable_window_ms: 5000
  - block: behaviors/uptime_log
    prefix: UP
    cfg:
      interval_seconds: 300

  # ── Status LED ──────────────────────────────────────────────
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1
  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  # ── Console: drive the switch's inputs over serial ──────────
  - block: behaviors/console_param_cmd
    prefix: CMD_POWER
    cfg:
      command_name: power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_LEVEL
    cfg:
      command_name: level
      target_param: APP_DRIVER_PARAM_BRIGHTNESS
      value_kind: u8
  - block: behaviors/console_param_cmd
    prefix: CMD_SCENE
    cfg:
      command_name: scene
      target_param: APP_DRIVER_PARAM_SWITCH_POSITION
      value_kind: u8
  - block: behaviors/console_uptime
    prefix: CON_UPTIME
    cfg: {}
  - block: behaviors/console_chip_info
    prefix: CON_CHIP
    cfg: {}
  - block: behaviors/console_heap_stats
    prefix: CON_HEAP
    cfg: {}
  - include: diagnostics-core

partition_table: 4mb

ci_chips: [esp32c6, esp32c3]

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode BLE Mesh Switch

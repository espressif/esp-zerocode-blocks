id: zigbee-light
name: Zigbee Light
description: Zigbee 3.0 smart light with an ambient temperature sensor — joins any Zigbee hub (Home Assistant ZHA/Z2M, Hue, Alexa) via network steering (first zigbee product; exercises the zigbee_* bindings on light + temperature_sensor)
keywords: [zigbee, light, hub, temperature, sensor]
frameworks: [zigbee]

instances:
  # ── Hardware ────────────────────────────────────────────────
  - block: drivers/relay
    prefix: LIGHT
    cfg:
      gpio: 7
      active_level: 1
      param_id: APP_DRIVER_PARAM_POWER

  - block: drivers/i2c_temp_humidity
    prefix: SENSOR
    cfg:
      i2c_port: 0
      sda_gpio: 1
      scl_gpio: 2
      freq_hz: 100000
      poll_interval_ms: 5000
      temp_param: APP_DRIVER_PARAM_TEMPERATURE
      humidity_param: APP_DRIVER_PARAM_HUMIDITY

  # ── Device types (Zigbee bindings) ──────────────────────────
  - block: device_types/light
    prefix: LIGHT
    cfg:
      power_param: APP_DRIVER_PARAM_POWER
      label: Light
      zb_endpoint: 10

  - block: device_types/temperature_sensor
    prefix: TEMP
    cfg:
      value_param: APP_DRIVER_PARAM_TEMPERATURE
      label: Temperature
      zb_endpoint: 11

  # ── Baseline behaviors. Omitted as N/A for Zigbee:
  #    wifi_disconnect_recovery / network_status_log (no Wi-Fi; the
  #    app_zigbee scaffold logs steering/join/leave natively),
  #    identify_blink (Matter identify). ──
  - block: behaviors/ota_basic
    prefix: OTA
    cfg: {}
  - block: behaviors/factory_reset_power_cycle
    prefix: FRPC
    cfg:
      count_threshold: 5
      stable_window_ms: 5000
  - block: behaviors/uptime_log
    prefix: UP
    cfg:
      interval_seconds: 300

  # ── Status LED (GPIO 10 — safe on all supported chips) ──────
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1
  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  # ── Persistence + console + diagnostics ─────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_POWER
    cfg:
      target_param: APP_DRIVER_PARAM_POWER
      nvs_namespace: app
      nvs_key: power
  - block: behaviors/console_uptime
    prefix: CON_UPTIME
    cfg: {}
  - block: behaviors/console_chip_info
    prefix: CON_CHIP
    cfg: {}
  - block: behaviors/console_version
    prefix: CON_VER
    cfg: {}
  - block: behaviors/console_heap_stats
    prefix: CON_HEAP
    cfg: {}
  - block: behaviors/console_param_cmd
    prefix: CMD_POWER
    cfg:
      command_name: power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_POWER
    cfg:
      command_name: get-power
      target_param: APP_DRIVER_PARAM_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_TEMP
    cfg:
      command_name: get-temp
      target_param: APP_DRIVER_PARAM_TEMPERATURE
      value_kind: i16
  - include: diagnostics-core

partition_table: 4mb

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Zigbee Light

id: smart-doorbell
name: Smart Doorbell
description: Matter doorbell — a button press is reported to the fabric over the Switch cluster
keywords: [doorbell, button, switch, matter]
frameworks: [matter]

instances:
  - block: drivers/button
    prefix: BELL_BTN
    cfg:
      gpio: 9
      active_level: 0
      target_param: APP_DRIVER_PARAM_DOORBELL_PRESS

  - block: device_types/doorbell
    prefix: BELL
    cfg:
      press_param: APP_DRIVER_PARAM_DOORBELL_PRESS

  - include: baseline-connectivity

  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  - include: console-diagnostics
  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Doorbell

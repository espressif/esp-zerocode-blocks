id: refrigerator
name: Smart Refrigerator
description: Matter refrigerator with two Temperature Controlled Cabinets (fridge + freezer) and a door alarm.
keywords: [refrigerator, fridge, freezer, appliance]
frameworks: [matter]

instances:
  - block: device_types/refrigerator
    prefix: FRIDGE
    cfg: {}
  # Each cabinet needs ITS OWN setpoint param — the block default is shared,
  # and two device-type instances consuming one param generate duplicate
  # case labels in every selected framework's driver_cb (validator errors on
  # this now). A fridge at 4°C and a freezer at -18°C can't share anyway.
  - block: device_types/temperature_controlled_cabinet
    prefix: FRIDGE_CAB
    cfg:
      label: Fridge
      zb_endpoint: 21
      setpoint_param: APP_DRIVER_PARAM_CABINET_SETPOINT
      audio_cmd_base: 310
  - block: device_types/temperature_controlled_cabinet
    prefix: FREEZER_CAB
    cfg:
      label: Freezer
      zb_endpoint: 22
      setpoint_param: APP_DRIVER_PARAM_FREEZER_SETPOINT
      audio_cmd_base: 315
  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  - include: console-diagnostics

  - include: diagnostics-core

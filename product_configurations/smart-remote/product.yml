id: smart-remote
name: Smart Remote / Handheld Controller
description: Multi-button handheld remote that emits Matter commands to bound devices (Color Dimmer Switch).
keywords: [remote, controller, handheld, dimmer]
frameworks: [matter]

# Each button is a momentary input — override <prefix>_on_press() in app code to
# emit OnOff / LevelControl::Step / ColorControl::MoveToHueAndSaturation commands
# via Matter bindings.
instances:
  - block: drivers/momentary_button
    prefix: BTN_ON
    cfg: { gpio: 4, active_level: 0 }

  - block: drivers/momentary_button
    prefix: BTN_OFF
    cfg: { gpio: 5, active_level: 0 }

  - block: drivers/momentary_button
    prefix: BTN_DIMUP
    cfg: { gpio: 6, active_level: 0 }

  - block: drivers/momentary_button
    prefix: BTN_DIMDN
    cfg: { gpio: 7, active_level: 0 }

  - block: device_types/color_remote
    prefix: REMOTE
    cfg: {}

  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  # ── Long-press factory reset (button hold 5 s) ─────────────────
  - block: behaviors/factory_reset_long_press
    prefix: FR
    cfg:
      gpio: 4
      active_level: 0
      hold_time_ms: 5000

  - include: console-diagnostics

  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Smart Remote

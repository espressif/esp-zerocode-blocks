id: water-heater
name: Smart Water Heater
description: Water-heater controller (Matter Water Heater) with relay-driven heating element
keywords: [water heater, geyser, hot water]
frameworks: [matter]

instances:
  - block: drivers/relay
    prefix: HEATER
    cfg:
      gpio: 7
      active_level: 1
      param_id: APP_DRIVER_PARAM_HEATER_POWER

  - block: device_types/water_heater
    prefix: WH
    cfg:
      power_param: APP_DRIVER_PARAM_HEATER_POWER
      setpoint_param: APP_DRIVER_PARAM_HEAT_SETPOINT

  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  # ── State persistence (survives reboot) ───────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_HPOWER
    cfg:
      target_param: APP_DRIVER_PARAM_HEATER_POWER
      nvs_namespace: app
      nvs_key: hpower

  - block: behaviors/nvs_persist_i16
    prefix: PERSIST_HEATSP
    cfg:
      target_param: APP_DRIVER_PARAM_HEAT_SETPOINT
      nvs_namespace: app
      nvs_key: heatsp

  - include: console-diagnostics

  # ── Console set/get for actuator params ───────────────────────────
  - block: behaviors/console_param_cmd
    prefix: CMD_HPOWER
    cfg:
      command_name: hpower
      target_param: APP_DRIVER_PARAM_HEATER_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_HPOWER
    cfg:
      command_name: get-hpower
      target_param: APP_DRIVER_PARAM_HEATER_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_HEATSP
    cfg:
      command_name: heatsp
      target_param: APP_DRIVER_PARAM_HEAT_SETPOINT
      value_kind: i16
  - block: behaviors/console_param_get
    prefix: GET_HEATSP
    cfg:
      command_name: get-heatsp
      target_param: APP_DRIVER_PARAM_HEAT_SETPOINT
      value_kind: i16

  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Water Heater

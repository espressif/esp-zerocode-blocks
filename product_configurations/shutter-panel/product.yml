id: shutter-panel
name: Shutter Panel
description: Matter ClosureDimension panel (louvre / slat / shutter section) driven to a target position by a DC motor
keywords: [shutter, louvre, slat, closure, panel, blind, motor]
frameworks: [matter]

instances:
  - block: drivers/curtain_motor
    prefix: PANEL_MOTOR
    cfg:
      up_gpio: 4
      down_gpio: 5
      upper_limit_gpio: 6
      lower_limit_gpio: 7
      position_param: APP_DRIVER_PARAM_LIFT_POSITION

  - block: device_types/closure_panel
    prefix: PANEL
    cfg:
      position_param: APP_DRIVER_PARAM_LIFT_POSITION

  - include: baseline-connectivity

  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 10
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 10
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  - include: console-diagnostics
  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Shutter Panel

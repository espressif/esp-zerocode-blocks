id: usb-multi-plug
name: USB Multi-Outlet Plug
description: Multi-port plug with 4 independently switched outlets (4 Matter On/Off Plug-in Unit endpoints)
keywords: [multi, plug, outlet, USB, power strip]
frameworks: [matter]

instances:
  - block: drivers/relay
    prefix: P1
    cfg: { gpio: 7,  active_level: 1, param_id: APP_DRIVER_PARAM_P1_POWER }
  - block: drivers/relay
    prefix: P2
    cfg: { gpio: 8,  active_level: 1, param_id: APP_DRIVER_PARAM_P2_POWER }
  - block: drivers/relay
    prefix: P3
    cfg: { gpio: 10, active_level: 1, param_id: APP_DRIVER_PARAM_P3_POWER }
  - block: drivers/relay
    prefix: P4
    cfg: { gpio: 9, active_level: 1, param_id: APP_DRIVER_PARAM_P4_POWER }

  - block: device_types/smart_plug
    prefix: PLUG1
    cfg: { power_param: APP_DRIVER_PARAM_P1_POWER }
  - block: device_types/smart_plug
    prefix: PLUG2
    cfg: { power_param: APP_DRIVER_PARAM_P2_POWER }
  - block: device_types/smart_plug
    prefix: PLUG3
    cfg: { power_param: APP_DRIVER_PARAM_P3_POWER }
  - block: device_types/smart_plug
    prefix: PLUG4
    cfg: { power_param: APP_DRIVER_PARAM_P4_POWER }

  - include: baseline-connectivity

  # ── Status LED + identify + commissioning indicator ────────────
  # Visible feedback during commissioning and for Matter Identify commands.
  # GPIO 15 is a sensible default (free across the catalog); reassign per
  # board as actual hardware is selected. Status-LED blocks share
  # APP_DRIVER_PARAM_LED_PATTERN so blink_pattern arbitrates between
  # commissioning_led and identify_blink.
  - block: drivers/status_led
    prefix: STATUS_LED
    cfg:
      gpio: 18
      active_level: 1

  - block: behaviors/blink_pattern
    prefix: STATUS
    cfg:
      gpio: 18
      active_level: 1
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/commissioning_led
    prefix: COMM_LED
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN

  - block: behaviors/identify_blink
    prefix: ID_BLINK
    cfg:
      pattern_param: APP_DRIVER_PARAM_LED_PATTERN
      identify_pattern: 3
      idle_pattern: 1

  # ── State persistence (survives reboot) ───────────────────────
  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_P1
    cfg:
      target_param: APP_DRIVER_PARAM_P1_POWER
      nvs_namespace: app
      nvs_key: p1

  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_P2
    cfg:
      target_param: APP_DRIVER_PARAM_P2_POWER
      nvs_namespace: app
      nvs_key: p2

  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_P3
    cfg:
      target_param: APP_DRIVER_PARAM_P3_POWER
      nvs_namespace: app
      nvs_key: p3

  - block: behaviors/nvs_persist_bool
    prefix: PERSIST_P4
    cfg:
      target_param: APP_DRIVER_PARAM_P4_POWER
      nvs_namespace: app
      nvs_key: p4

  - include: console-diagnostics

  # ── Console set/get for actuator params ───────────────────────────
  - block: behaviors/console_param_cmd
    prefix: CMD_P1
    cfg:
      command_name: p1
      target_param: APP_DRIVER_PARAM_P1_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_P1
    cfg:
      command_name: get-p1
      target_param: APP_DRIVER_PARAM_P1_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_P2
    cfg:
      command_name: p2
      target_param: APP_DRIVER_PARAM_P2_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_P2
    cfg:
      command_name: get-p2
      target_param: APP_DRIVER_PARAM_P2_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_P3
    cfg:
      command_name: p3
      target_param: APP_DRIVER_PARAM_P3_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_P3
    cfg:
      command_name: get-p3
      target_param: APP_DRIVER_PARAM_P3_POWER
      value_kind: bool
  - block: behaviors/console_param_cmd
    prefix: CMD_P4
    cfg:
      command_name: p4
      target_param: APP_DRIVER_PARAM_P4_POWER
      value_kind: bool
  - block: behaviors/console_param_get
    prefix: GET_P4
    cfg:
      command_name: get-p4
      target_param: APP_DRIVER_PARAM_P4_POWER
      value_kind: bool

  - include: diagnostics-core

product_metadata:
  vendor_name: ZeroCode AI
  product_name: ZeroCode Multi-Outlet Plug

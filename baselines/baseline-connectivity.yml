# Field-deployability baseline: OTA updates, factory reset via 5 power
# cycles, periodic uptime + network diagnostics, Wi-Fi outage logging (no
# reboot — that is opt-in per product), and a wall clock (timezone + SNTP).
# No extra hardware needed.
instances:
  - block: behaviors/ota_basic
    prefix: OTA
    cfg: {}
  - block: behaviors/factory_reset_power_cycle
    prefix: FRPC
    cfg:
      count_threshold: 5
      stable_window_ms: 5000
  - block: behaviors/uptime_log
    prefix: UP
    cfg:
      interval_seconds: 300
  - block: behaviors/network_status_log
    prefix: NETLOG
    cfg: {}
  # Outage LOGGING only. A reboot on Wi-Fi loss is a per-product opt-in
  # (reboot_after_seconds > 0) — this baseline reaches products with local
  # automation, which must keep running through a network fault.
  - block: behaviors/wifi_disconnect_recovery
    prefix: NETRECOV
    cfg:
      reboot_after_seconds: 0
  # Wall clock. Schedules, daily budgets, night windows and timestamps all
  # read time(); without a time source they run on the 1970 epoch. UTC by
  # default — a product sets tz when it knows where it lives.
  - block: behaviors/sntp_time
    prefix: CLOCK
    cfg:
      tz: "UTC0"

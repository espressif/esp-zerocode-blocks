description: Shared SPI bus init for products with multiple SPI devices on the same lines.

# Adopts rather than collides: a host another block (drivers/display_ili9341_spi)
# already initialized is logged and left as that block configured it, and the
# panel does the same if this block ran first. Give max_transfer_size room for
# the largest transfer of any device on the host (an ILI9341 band is
# HRES*40*2 bytes).

params:
  host:
    type: int
    default: 1
    description: SPI host (1 = SPI2, 2 = SPI3 on most chips)
  mosi_gpio: { type: int, required: true }
  miso_gpio: { type: int, required: true }
  sclk_gpio: { type: int, required: true }
  max_transfer_size: { type: int, default: 4096 }

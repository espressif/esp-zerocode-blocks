description: >-
  Sends Telegram messages to the owner's phone from a bot ("the washer is
  done"), and can read the owner's replies. telegram_notify_send(text) queues
  and returns at once; a task of its own sends over HTTPS, keeps unsent
  messages on the device across reboots and retries until each one is
  delivered. Optionally sends a fixed message whenever a bool param turns
  true. The bot token and chat id are device data or console settings, never
  compiled in. Needs internet: behaviors/wifi_station, or a framework that
  brings up Wi-Fi. Compose this instead of writing a Telegram client.

# THE API (declared in app_config.h, C linkage):
#   esp_err_t telegram_notify_send(const char *text);
#       Copies the text (cut to TELEGRAM_NOTIFY_MAX_TEXT bytes) into a RAM
#       queue and returns; never blocks on flash or the network, so it is safe
#       from an esp_timer callback, a param-bus callback, a console command or
#       an ISR-free task. ESP_ERR_NO_MEM when the RAM queue is full,
#       ESP_ERR_INVALID_STATE before the block's init has run.
#   esp_err_t telegram_notify_on_reply(telegram_notify_reply_cb_t cb, void *ctx);
#       cb(text, ctx) runs on the Telegram task for each new text message from
#       the stored chat. Registering it starts polling. Keep cb short; it may
#       call telegram_notify_send.
#   size_t telegram_notify_pending(void);
#       Messages not yet delivered.
#
# THE TASK owns all network work (TLS needs far more stack than an esp_timer
# or console task has): it moves queued messages to NVS first, then sends the
# oldest; a failure retries with backoff (5 s doubling to max_retry_s, or the
# retry_after Telegram asks for). At most max_pending messages are kept; a new
# one beyond that drops the oldest KEYED message, and the oldest un-keyed one
# only when nothing waiting is keyed, with a log line. Each text has its own
# NVS slot and an index blob holds the order and keys, so keys survive a
# reboot too; the ring an earlier version kept is read once and converted. A
# message whose send succeeded just before a power cut can be sent again
# after the reboot.
#
# REPLIES are read with getUpdates and a stored offset. Before the first poll
# of every boot the backlog is skipped (offset -1: the newest update, then its
# id + 1), so a /start left from setup or an answer to an earlier message is
# never taken as a reply to this one. Only text messages from the stored chat
# reach the callback.
#
# THE CHAT ID is learnt with tg-learn: the task reads the newest update only
# (offset -1, limit 1) and refuses a response that did not fit its buffer.
#
# SETTINGS: console values (NVS namespace zc_tg) win over device data (fctry,
# namespace zc_tg). A factory reset clears the console values and the pending
# messages.

needs_internet: true
singleton: true

params:
  trigger_text:
    type: string
    default: "Done"
    description: Message sent each time trigger_param turns true (plain text, no double quotes)
  max_pending:
    type: int
    default: 8
    description: Undelivered messages kept on the device (1-32); a new one beyond this drops the oldest keyed message, else the oldest
  max_retry_s:
    type: int
    default: 60
    description: Longest wait between two tries of an undelivered message, in seconds (5-3600); the wait starts at 5 s and doubles up to this
  poll_seconds:
    type: int
    default: 10
    description: Long-poll wait for replies, in seconds (1-50); a queued message may wait this long while a poll is open

driver_params:
  trigger_param:
    type: bool
    required: false
    default: ""
    description: (Optional) bool param that sends trigger_text each time it changes to true (cycle_done_detector's done_param, a contact sensor). Empty disables.

device_data:
  namespace: zc_tg
  keys:
    - key: token
      encoding: string
      label: Telegram bot token (from @BotFather)
      required: false
    - key: chat
      encoding: string
      label: Telegram chat id (or learn it with tg-learn)
      required: false

cmake_priv_requires:
  app_logic: [esp_http_client, esp-tls, mbedtls, esp_netif, esp_event, nvs_flash, console, espressif__json_parser]

console_commands:
  - "tg-token <bot token>"
  - "tg-chat <chat id>"
  - "tg-learn"
  - "tg-test [text]"
  - "tg-status"

facts:
  bot_setup: "The owner creates a bot with @BotFather in Telegram, enters its token (in the flash form, or tg-token <token> at the USB serial console), sends the bot any message from their phone, then runs tg-learn so the device learns which chat to write to."
  test: "tg-test sends a test message, and tg-status shows whether the token and chat are set, whether the network is up and how many messages are waiting."
  delivery: "Messages need the device to be online; one that cannot be sent is kept on the device, through reboots, and retried, so it may arrive late (up to 8 waiting by default; beyond that the oldest repeating one is dropped first). One Telegram refuses outright (too long, malformed), or answers with a server error 8 times running, is dropped so it cannot hold up the rest."
  repeating: "A message the firmware sends again and again (a reminder every 10 minutes, a status) must use telegram_notify_send_keyed(key, text): a waiting copy with the same key is replaced instead of queued again, and a full queue drops keyed messages before one-off ones, so the reminder never pushes out a message like 'the wash finished' while the network is down."
  retry: "While Telegram cannot be reached a waiting message is tried again after 5 s, then twice as long each time up to max_retry_s (60 s by default), so it arrives at most about that long after the network returns."
  replies: "When the product listens for replies, only text messages from the owner's chat count, and anything sent before the device started is ignored, so an old message is never taken as a new answer."
  length: "A message is cut to 1000 bytes (Telegram itself allows 4096 characters); plain text only."
  device_data: "The bot token and chat id are this block's own device data: the flash page asks for them (zc_tg/token, zc_tg/chat) whenever the block is composed, and the firmware reads them there. A spec does not declare them again in its own deviceData."
  privacy: "The messages go through Telegram's servers; the bot token and chat id stay on the device. A factory reset clears the ones set at the console, not the ones entered on the flash page; to clear those too, define app_factory_reset_hook() and erase the fctry partition there (nvs_flash_erase_partition(\"fctry\"))."

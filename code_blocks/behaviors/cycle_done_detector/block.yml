description: >-
  Appliance cycle monitor: from a vibration activity level (drivers/mpu6050
  activity_param, drivers/vibration_switch) decides when a washer, dryer or
  dishwasher is running and when its cycle has finished. Publishes running and
  done booleans for a buzzer, LED, notification or cloud device to bind to.
  Pauses inside a cycle (fill, soak, drain) do not count as finished. Compose
  this instead of writing "wash finished" logic.

# HOW IT DECIDES, once a second:
#
#   active second  activity >= threshold, where
#                  threshold = max(min_level, idle + margin)
#   start          start_active_seconds active seconds within the last
#                  window_seconds (a door slam or footsteps give a few; a
#                  machine gives them continuously) -> running = true,
#                  done = false
#   still busy     busy_active_seconds active seconds within the window: the
#                  quiet clock restarts. A lone knock does not hold a finished
#                  cycle open.
#   finished       quiet for quiet_minutes AND the run lasted min_run_minutes
#                  -> running = false, done = true. Quiet that comes earlier is
#                  a false start (the machine was moved): back to idle, no done.
#
# done stays true until the NEXT run starts, so it re-arms only on a new cycle,
# and every cycle is one false -> true change for whatever binds to it.
#
# THE QUIET TIME is the knob that matters. Washers pause for minutes while
# they fill, soak and drain (2-15 min is common); a quiet time shorter than
# the longest pause reports "done" in the middle of the wash. The default is
# 15 minutes. A dryer has no long pauses: 5 minutes is enough there.
#
# THE IDLE LEVEL. idle_level -1 learns it: a slow average of the activity
# while not running and with no active second in the window, never in the
# first window after boot, and capped at 4 x min_level. So a device that
# boots beside a running machine starts from min_level and sees a run, rather
# than learning the running machine as "idle". Set idle_level to fix it.
#
# REBOOT MID-CYCLE. running is kept in NVS (written only when it changes). A
# device that restarts while a cycle runs comes back running with the minimum
# run already served, so the cycle still ends in done; without it the shorter
# remainder after the restart would read as a false start.
#
# UNITS. min_level, margin and idle_level are in the activity source's own
# unit — mg RMS from drivers/mpu6050 (noise ~5, washers tens to hundreds),
# pulses per minute from drivers/vibration_switch (0 at rest). The defaults
# suit both; raise min_level if a busy room starts false runs.

cmake_priv_requires:
  app_logic: [nvs_flash, esp_timer]

params:
  min_level:
    type: int
    default: 15
    description: >-
      Lowest activity that ever counts as running, in the source's unit. Keep
      it well above the sensor's resting noise (mpu6050 ~5 mg).
  margin:
    type: int
    default: 10
    description: How far above the idle level the activity must rise to count.
  idle_level:
    type: int
    default: -1
    description: Resting activity level; -1 learns it while the machine is idle.
  window_seconds:
    type: int
    default: 120
    description: Sliding window the active seconds are counted in (10-600).
  start_active_seconds:
    type: int
    default: 30
    description: Active seconds within the window that start a run.
  busy_active_seconds:
    type: int
    default: 10
    description: Active seconds within the window that mean a run is still going (restart the quiet clock).
  min_run_minutes:
    type: int
    default: 10
    description: A run shorter than this never reports done (a false start).
  quiet_minutes:
    type: int
    default: 15
    description: >-
      Quiet time that ends a run. Must exceed the machine's longest mid-cycle
      pause (washer fill/soak/drain 2-15 min); 5 is enough for a dryer.
  nvs_namespace:
    type: string
    default: app
  nvs_key:
    type: string
    default: cycle_run
    description: NVS key for the running flag (unique per instance, at most 15 characters).

driver_params:
  activity_param:
    type: u16
    required: true
    description: Activity level to watch (mpu6050 activity_param, vibration_switch activity_param).
  running_param:
    type: bool
    required: true
    description: Published — true while a cycle runs.
  done_param:
    type: bool
    required: true
    description: Published — true once a cycle has finished, until the next one starts.

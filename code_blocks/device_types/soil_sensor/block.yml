description: "Soil Sensor device type (read-only soil moisture, whole percent 0-100) (Matter: soil_sensor / SoilMeasurement; RainMaker: esp.device.other; MQTT: Home Assistant moisture sensor)"
device_types:
  matter: soil_sensor
  rainmaker: esp.device.other
# No Zigbee binding: ZCL's Soil Moisture cluster (0x0408) is not in
# esp-zigbee-lib 2.x (no ezb_zcl_* descriptor for it), and reporting moisture
# as Relative Humidity would put a false "humidity" entity in ZHA / Z2M. A
# Zigbee product with this block gets no endpoint for it.

# Framework SDK deps come from the framework blocks (frameworks/matter,
# frameworks/rainmaker, frameworks/mqtt, …) — this block contributes only bindings.

params:
  label:
    type: string
    default: Soil Moisture
    description: User-visible device name (RainMaker device name / Home Assistant entity name; must be unique per node)

driver_params:
  value_param:
    type: u8
    required: true
    description: Driver param ID this endpoint mirrors (uint8, soil moisture in whole percent 0-100 — what drivers/soil_moisture_adc publishes)
  status_param:
    type: bool
    required: false
    shared: true
    default: ""
    description: >-
      (Optional) the reading is valid (true) or not (false) — the driver's
      status_param (aht21, bh1750, dht22, ds18b20, hcsr04 publish one). When
      false, Home Assistant shows the sensor as unknown instead of the last
      value. Empty disables.

facts:
  unavailable: "With status_param wired to the driver's status, a sensor that stops answering shows as unknown in Home Assistant instead of its last reading, and its value comes back by itself when the sensor does; product code never publishes a placeholder value."
  matter: "On Matter it is a Soil Sensor endpoint whose SoilMeasurement moisture value (0-100 %) follows the probe; the soil sensor is a recent Matter device type, so some controller apps may not show it yet."
  home_assistant: "Over MQTT, Home Assistant discovers it as a Moisture sensor entity in % under the device; the value is retained by the broker once the probe has produced a first reading."
  web_page: "On the web page it is a reading row showing the moisture in whole percent."
  display: "On the display it is a card with its name and the moisture in whole percent."
  rainmaker: "In the RainMaker app it is a read-only device whose Moisture value is in percent."
  no_zigbee: "Zigbee has no binding: a Zigbee product shows no soil moisture entity."
  relative_value: "The percent is relative wetness between the probe's calibrated dry and wet points, not volumetric water content, and the device does not water anything by itself."

# Voice-absent: read-only telemetry — there are no commands to issue, and with no TTS path the device cannot answer a question about a reading either.

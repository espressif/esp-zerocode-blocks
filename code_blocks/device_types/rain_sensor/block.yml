description: "Rain Sensor device type (BooleanState — true if rain detected) (Matter: rain_sensor; RainMaker: esp.device.other; Zigbee: IAS Zone / Water Sensor)"
device_types:
  matter: rain_sensor
  rainmaker: esp.device.other
  zigbee: EZB_ZHA_IAS_ZONE_ID

# Framework SDK deps come from the framework blocks (frameworks/matter,
# frameworks/rainmaker) — this block contributes only bindings.

params:
  label:
    type: string
    default: Rain Sensor
    description: User-visible device name (RainMaker device name; must be unique per node)
  zb_endpoint:
    type: int
    default: 28
    description: Zigbee endpoint number (1-240; must be unique per node)

driver_params:
  rain_param:
    type: bool
    required: true

facts:
  fixed_class: "Over MQTT its Home Assistant class is fixed to moisture (Wet while the param is true, Dry while false), so it is only for a real rain sensor; a product's own flag such as \"needs water\" belongs in device_types/generic_binary_sensor with class problem."

# Voice-absent: read-only telemetry — there are no commands to issue, and with no TTS path the device cannot answer a question about a reading either.

description: "Event-emitting button / scene switch (Matter: generic_switch; Zigbee: On/Off Switch client — sends Toggle to bound targets)"
# RainMaker: no equivalent (models state-holders only).
# Zigbee: CONTROLLER binding — On/Off client cluster; each position_param
# change sends a Toggle command to Finding & Binding targets (`zb-bind`).
device_types:
  matter: generic_switch
  zigbee: EZB_ZHA_ON_OFF_SWITCH_DEVICE_ID

# Framework SDK deps come from the framework blocks (frameworks/matter, ...) —
# this block contributes only bindings.

# Matter: each nonzero position_param notification is ONE momentary press on the
# Generic Switch — CurrentPosition goes to that position, InitialPress is emitted,
# then CurrentPosition returns to 0 (+ ShortRelease where the feature is on).
# Controllers act on the events. Drive it with an EVENT producer
# (drivers/momentary_button's position_param fires 1 per click), never a
# set_param of the same value twice, which the bus would swallow.
params:
  zb_endpoint:
    type: int
    default: 70
    description: Zigbee endpoint number (1-240; must be unique per node)

  ble_hid_usage:
    type: int
    default: 205
    description: >-
      (BLE HID framework) Consumer usage this button sends, decimal.
      205 = 0xCD play/pause; 226 = 0xE2 mute; 181 = 0xB5 next track;
      182 = 0xB6 previous track. Ignored by every other framework.

driver_params:
  position_param:
    type: u8
    required: true
    description: Driver param ID for switch presses (uint8_t; each notification is one press at that position, 1..NumberOfPositions-1; 0 = no press)

# Voice-absent: a controller is an INPUT — it commands other devices rather than holding state you can command. Voice is itself an input, so binding one to the other is meaningless.

# MQTT binding: an HA device_trigger (controllers are inputs — they emit
# events for automations, not stateful entities).

# Display-absent: a controller device type is itself an input — on a touchscreen the SCREEN is the controller, so bind the actuator/sensor types directly.

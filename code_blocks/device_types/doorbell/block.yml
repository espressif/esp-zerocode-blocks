description: "Doorbell device type (button press reported over Matter; Switch cluster with the Momentary Switch feature). Every press_param notification is one ring: an InitialPress event with CurrentPosition 1 then back to 0."
# Matter-only today. RainMaker/Zigbee: no direct equivalent.
device_types:
  matter: doorbell

# Framework SDK deps come from the framework blocks (frameworks/matter) —
# this block contributes only bindings.

driver_params:
  press_param:
    type: bool
    required: true
    description: Driver param ID that changes once per button press (either direction; drivers/button toggles it) — each notification rings once (InitialPress). Pair with drivers/button.

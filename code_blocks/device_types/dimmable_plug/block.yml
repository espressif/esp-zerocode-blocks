description: "Dimmable smart plug for incandescent loads (Matter: dimmable_plug_in_unit; RainMaker: esp.device.plug; Zigbee: Level Controllable Output)"
device_types:
  matter: dimmable_plug_in_unit
  rainmaker: esp.device.plug
  zigbee: EZB_ZHA_LEVEL_CONTROLLABLE_OUTPUT_DEVICE_ID

# Framework SDK deps come from the framework blocks (frameworks/matter,
# frameworks/rainmaker) — this block contributes only bindings.

params:
  label: { type: string, default: Dimmable Plug, description: "User-visible device name (RainMaker device name; must be unique per node)" }
  zb_endpoint:
    type: int
    default: 15
    description: Zigbee endpoint number (1-240; must be unique per node)

  audio_cmd_base:
    type: int
    default: 140
    description: >-
      First voice-command phrase id for this instance (audio framework).
      Phrase ids must be unique across the whole node, so give each device
      instance its own base with room for its phrases — same discipline as
      zb_endpoint. Ignored by every other framework.

  say_turn_on_the_plug:
    type: string
    default: "turn on the plug"
    description: 'Voice phrase (customizable) for command slot 0 — default: "turn on the plug"'
  say_turn_off_the_plug:
    type: string
    default: "turn off the plug"
    description: 'Voice phrase (customizable) for command slot 1 — default: "turn off the plug"'
  say_make_it_brighter:
    type: string
    default: "make it brighter"
    description: 'Voice phrase (customizable) for command slot 2 — default: "make it brighter"'
  say_make_it_dimmer:
    type: string
    default: "make it dimmer"
    description: 'Voice phrase (customizable) for command slot 3 — default: "make it dimmer"'

driver_params:
  power_param:      { type: bool, default: APP_DRIVER_PARAM_POWER }
  brightness_param: { type: u8, default: APP_DRIVER_PARAM_BRIGHTNESS }

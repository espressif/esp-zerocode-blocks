description: "Contact Sensor device type (door/window reed switch) (Matter: contact_sensor; RainMaker: esp.device.other; Zigbee: IAS Zone / Contact Switch)"
device_types:
  matter: contact_sensor
  rainmaker: esp.device.other
  zigbee: EZB_ZHA_IAS_ZONE_ID

# Framework SDK deps come from the framework blocks (frameworks/matter,
# frameworks/rainmaker) — this block contributes only bindings.

params:
  label:
    type: string
    default: Contact Sensor
    description: User-visible device name (RainMaker device name; must be unique per node)
  zb_endpoint:
    type: int
    default: 27
    description: Zigbee endpoint number (1-240; must be unique per node)

driver_params:
  state_param:
    type: bool
    required: true
    description: Driver param ID for contact state (boolean — true if contact closed)

facts:
  fixed_class: "Over MQTT its Home Assistant class is fixed to door (Open while the contact is open, Closed while closed), so it is only for a real door or window contact; a product's own flag belongs in device_types/generic_binary_sensor with the class that fits."

# Voice-absent: read-only telemetry — there are no commands to issue, and with no TTS path the device cannot answer a question about a reading either.

# What the block does on its dispatch slots (returned by generate() as reactions).
reacts:
  zigbee_action: "The hub's answer to the IAS Zone enrollment is logged (accepted or rejected); there is nothing for product code to wire."

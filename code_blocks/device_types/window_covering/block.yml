description: "Window Covering device type — curtain/blind/shade (Matter: window_covering; RainMaker: esp.device.blinds-internal)"
device_types:
  matter: window_covering
  rainmaker: esp.device.blinds-internal
  zigbee: EZB_ZHA_WINDOW_COVERING_DEVICE_ID

# Framework SDK deps come from the framework blocks (frameworks/matter,
# frameworks/rainmaker) — this block contributes only bindings.

# position_param is percent OPEN (0 = closed, 10000 = fully open), as the
# driver, voice, MQTT, RainMaker and display bindings all count it. Matter
# (*LiftPercent100ths) and ZCL (lift percentage) count percent CLOSED
# (0 = open), so those two bindings convert at the boundary. Matter runs with
# Lift + PositionAwareLift, so Up/Down/GoToLiftPercentage set Target, which
# reaches the driver.
params:
  label:
    type: string
    default: Blinds
    description: User-visible device name (RainMaker device name; must be unique per node)
  zb_endpoint:
    type: int
    default: 61
    description: Zigbee endpoint number (1-240; must be unique per node)

  audio_cmd_base:
    type: int
    default: 250
    description: >-
      First voice-command phrase id for this instance (audio framework).
      Phrase ids must be unique across the whole node, so give each device
      instance its own base with room for its phrases — same discipline as
      zb_endpoint. Ignored by every other framework.

  say_open_the_blinds:
    type: string
    default: "open the blinds"
    description: 'Voice phrase (customizable) for command slot 0 — default: "open the blinds"'
  say_close_the_blinds:
    type: string
    default: "close the blinds"
    description: 'Voice phrase (customizable) for command slot 1 — default: "close the blinds"'
  say_raise_the_blinds:
    type: string
    default: "raise the blinds"
    description: 'Voice phrase (customizable) for command slot 2 — default: "raise the blinds"'
  say_lower_the_blinds:
    type: string
    default: "lower the blinds"
    description: 'Voice phrase (customizable) for command slot 3 — default: "lower the blinds"'

driver_params:
  position_param:
    type: u16
    required: true
    description: >-
      Driver param ID for the lift position (uint16, 0-10000 = percent OPEN in
      0.01% units; 10000 = fully open). Every command lands here. Without
      current_param it is also the position every binding reports; with
      current_param it is the TARGET only.
  current_param:
    type: u16
    required: false
    description: >-
      Optional. Driver param ID for the MEASURED lift position (same units as
      position_param; 0xFFFF = unknown). Product code writes it as the blind
      moves; every binding reports it as the current position (Matter
      CurrentPositionLiftPercent100ths is null while unknown) and commands
      never touch it. Use it whenever the position is measured or estimated
      (encoder, travel time) rather than equal to the last command.
  stop_param:
    type: u8
    required: false
    description: >-
      Optional. Driver param FIRED with 1 when a Stop arrives (Matter
      StopMotion, the MQTT STOP command). An event: every Stop is delivered,
      also while the position is unknown.

facts:
  target_vs_current: "With current_param, commands (Matter Up/Down/GoToLiftPercentage, RainMaker, MQTT, voice, display) write position_param as the target and nothing else; the product writes current_param as the blind moves (0xFFFF while unknown, reported to Matter as a null CurrentPosition). Publishing the measured position on position_param instead makes it look like a new command."
  stop: "With stop_param, a Matter StopMotion or MQTT STOP fires stop_param once; the product stops the motor there. Matter then sets Target to Current (or leaves it null when Current is unknown), which lands on position_param as the current position, so a stopped blind does not move again."

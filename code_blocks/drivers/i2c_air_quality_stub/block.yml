description: "Placeholder for an I2C air-quality sensor: brings up the I2C bus and a poll timer, and PUBLISHES NOTHING (it logs that no sensor protocol is implemented). Not a working sensor — for real readings use a real driver (drivers/scd4x for CO2, drivers/sgp40 for VOC) or write the protocol in."

# CONFIGURES its own I2C bus (it takes its own sda_gpio/scl_gpio/freq_hz), so
# it is a provider: a sensor block declaring `requires_bus:` on the same port
# is satisfied by an instance of this one placed earlier in instances:.

# esp_driver_i2c carries driver/i2c_master.h — see peripherals/i2c_bus.
cmake_priv_requires:
  app_driver: [esp_driver_i2c]

provides_bus:
  type: i2c
  port_param: i2c_port

params:
  i2c_port: { type: int, default: 0 }
  sda_gpio: { type: int, required: true }
  scl_gpio: { type: int, required: true }
  freq_hz:  { type: int, default: 100000 }
  poll_interval_ms: { type: int, default: 30000 }
  # Unused since the block stopped publishing a fake reading. Kept so products
  # that still set them validate; they change nothing.
  initial_quality:  { type: int, default: 1, description: Unused — nothing is published }
  initial_co2_ppm:  { type: int, default: 800, description: Unused — nothing is published }

driver_params:
  air_quality_param:
    type: u8
    required: false
    default: ""
    description: (Optional, unused) param a real driver would publish the AirQuality enum on. This placeholder never writes it.
  co2_ppm_param:
    type: u16
    required: false
    default: ""
    description: (Optional, unused) param a real driver would publish CO2 ppm on. This placeholder never writes it.
maturity: stub

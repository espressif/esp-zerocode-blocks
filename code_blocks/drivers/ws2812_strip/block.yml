description: Addressable RGB LED strip driver (WS2812 / SK6812) via espressif/led_strip 2.5.x

# Treats the whole strip as one logical RGB element (all LEDs the same color).
# To address segments differently, replace the apply function post-generation.
# IMPORTANT: led_strip MUST be ~2.5.0 (NOT ^3.0.0 — led_indicator 1.x uses 2.x APIs).

params:
  gpio:
    type: int
    required: true
    description: Data-line GPIO connected to the strip
  num_leds:
    type: int
    required: true
    description: Number of LEDs in the strip
  rmt_resolution_hz:
    type: int
    default: 10000000
    description: RMT base clock for WS2812 timing

driver_params:
  power_param:      { type: bool, default: APP_DRIVER_PARAM_POWER }
  brightness_param: { type: u8, default: APP_DRIVER_PARAM_BRIGHTNESS }
  hue_param:        { type: u8, default: APP_DRIVER_PARAM_HUE }
  saturation_param: { type: u8, default: APP_DRIVER_PARAM_SATURATION }

reacts:
  driver: "A change of {{cfg.power_param}}, {{cfg.brightness_param}}, {{cfg.hue_param}} or {{cfg.saturation_param}} repaints every LED of the strip with the resulting colour (dark while power is false); product code writes the params and never calls led_strip itself."

facts:
  own_strip: "A strip the person wires is this block on its own data pin with its LED count; a board\u2019s on-board RGB LED (drivers/board_led_strip) drives only the board\u2019s own LEDs, often a single one."
  on_off_gate: "The LED lights only while its on/off param (power_param) is true: hue, saturation and brightness change the colour it shows when on, and with the on/off param false or never written it stays dark."

description: Basic SSD1306 128x64 OLED via I2C — initializes the display and provides a clear/print/text-at-any-size API. Depends on peripherals/i2c_bus.

# Minimal SSD1306 driver: init sequence + framebuffer flush. Includes a tiny 6x8
# bitmap font for ASCII (basic Latin only), drawn at any integer scale. The
# API is declared in app_config.h (see config_defines.h). For richer graphics,
# swap in u8g2 or lvgl post-generation.

# This block TALKS on an I2C bus it does not configure: it attaches a device to
# whatever bus already exists on the port below (driver/i2c_master.h,
# i2c_master_get_bus_handle). Declared so the validator can check that
# assumption — without it a product composed with this sensor and no bus
# provider builds clean, links clean, boots, and is silent on the device with
# nothing in any report saying why. The provider may be an earlier
# peripherals/i2c_bus instance or a board that owns the port; this block cannot
# tell the two apart, which is the point. See engine/src/types.ts (BusDecl) and
# CLAUDE.md → Shared buses.

# esp_driver_i2c carries driver/i2c_master.h — see peripherals/i2c_bus.
cmake_priv_requires:
  app_driver: [esp_driver_i2c]

requires_bus:
  type: i2c
  port_param: i2c_port

params:
  i2c_freq_hz:
    type: int
    default: 100000
    description: >-
      SCL clock for THIS device, in Hz. The new I2C driver clocks each device
      rather than the bus, so two sensors sharing one bus may legitimately ask
      for different speeds.
  i2c_port: { type: int, default: 0 }
  i2c_address: { type: int, default: 0x3C }

facts:
  drawing: "Product code draws through <prefix>_oled_text(x, y, scale, s) (scale 1-8: 6*scale x 8*scale pixels a character, e.g. scale 3 = 18x24 for a big mm:ss), <prefix>_oled_fill and <prefix>_oled_print, all declared in app_config.h; a screen is composed with _text/_fill and sent once with _show — never by adding functions to the generated app_driver.cpp."
  refresh: "One _show sends the whole 1 KB frame over I2C (about 25 ms at 400 kHz, 100 ms at 100 kHz), so a screen updates once per change, not once per character."

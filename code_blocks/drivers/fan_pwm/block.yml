description: >-
  LEDC PWM-driven DC fan (speed 0-100, mapped to 0-100% duty). For a 4-pin PC
  fan the PWM pin is pulled up inside the fan (to at most 5.25 V): never wire
  it straight to a 3.3 V GPIO — drive it through an NPN or N-MOSFET that pulls
  it low, and set output_invert to 1, because that stage inverts (GPIO high =
  line low = slowest). Most 4-pin fans keep turning at 0 %; to stop one, switch
  its supply.

params:
  gpio:
    type: int
    required: true
    description: GPIO pin connected to fan PWM input (typically through MOSFET)
  ledc_channel:
    type: int
    default: 1
    description: LEDC channel (must differ from any other LEDC user)
  ledc_timer:
    type: int
    default: 1
    description: LEDC timer
  freq_hz:
    type: int
    default: 25000
    description: PWM frequency (25 kHz typical for DC fans, above audible range)
  output_invert:
    type: int
    default: 0
    description: 1 when the stage between the GPIO and the fan inverts the signal (an NPN or N-MOSFET pulling a 4-pin fan's PWM line low); speed then still means fan speed.

driver_params:
  speed_param:
    type: u8
    default: APP_DRIVER_PARAM_FAN_SPEED
    description: Driver param ID for fan speed (uint8_t, 0-100)

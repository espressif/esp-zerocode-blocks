description: HLW8012 / BL0937 single-phase energy meter. Counts pulses on CF (active power) and CF1 (current/voltage) GPIOs. Creates its own PCNT unit for CF (no peripherals/pcnt_unit needed). PCNT hardware is not on esp32c2/c3/c61.

# HLW8012 outputs two pulse trains:
#   - CF  : pulse rate ∝ active power (W)
#   - CF1 : pulse rate ∝ either voltage or current, switched by SEL pin (HIGH=I, LOW=V)
# This block measures CF only (active power); for voltage / current add a second
# instance pointing at CF1 and toggle SEL via GPIO.
#
# Power calibration: power_scale_milliw_per_hz is the slope, mW per Hz of CF.
# From the datasheet, F_CF = 48 * V_V * V_I * (F_osc / 128) / Vref^2 with
# F_osc = 3.579 MHz and Vref = 2.43 V, so for the common front end — a 1 mOhm
# shunt and a 2.35 MOhm : 1 kOhm voltage divider (Sonoff POW and most clones) —
# one Hz of CF is ~10.3 W: a 230 W load pulses at ~22 Hz. The default below is
# that design; any other shunt or divider scales it (calibrate against a known
# resistive load: scale = load_mW / measured_Hz). It used to default to 1206000,
# which reported a 230 W load as ~26 kW.

params:
  cf_gpio:
    type: int
    required: true
    description: GPIO connected to CF (active power) pulse output
  pulse_window_ms:
    type: int
    default: 2000
    description: Counting window. Longer = smoother, slower update.
  power_scale_milliw_per_hz:
    type: int
    default: 10340
    description: Power in mW per Hz of CF pulses. 10340 = a 1 mOhm shunt + 2.35 MOhm:1 kOhm divider; other front ends scale it — calibrate against a known load.

driver_params:
  power_param:
    type: u32
    required: true
    description: u32 active power (mW)

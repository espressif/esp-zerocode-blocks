description: Phase-cut AC dimmer (zero-cross detect + triac gate pulse). Real AC dimming for incandescent / dimmable LED loads.

# Hardware: zero-cross-detect (ZCD) opto pulses on every AC half-cycle (every 10 ms
# at 50 Hz, 8.33 ms at 60 Hz). Triac gate fires after a delay measured from the
# zero-cross — longer delay = lower brightness.
#
# This driver:
#  - Hooks a GPIO ISR on the ZCD edge
#  - Schedules a one-shot timer to fire the gate after delay_us
#  - delay_us = (half_cycle_us * (255 - brightness)) / 255
# Installs the shared GPIO ISR service itself if no earlier block did
# (peripherals/gpio_isr_service is optional).

# The gate pulse must land within microseconds of its deadline, so the one-shot
# timer dispatches from the ISR (ESP_TIMER_ISR), not the esp_timer task. IDF
# declares ESP_TIMER_ISR only when this option is on (default n) — without it
# the block does not compile.
# That ISR is IRAM-safe (CONFIG_ESP_TIMER_IN_IRAM, default y), so it also fires
# while flash is being written — an NVS save of the brightness, say — and then
# everything the callback calls must be in IRAM too. gpio_set_level is placed
# there only with GPIO_CTRL_FUNC_IN_IRAM (default n); without it a gate pulse
# that lands during a flash write is a cache-access panic, at 100-120 pulses
# a second.
sdkconfig:
  CONFIG_ESP_TIMER_SUPPORTS_ISR_DISPATCH_METHOD: 'y'
  CONFIG_GPIO_CTRL_FUNC_IN_IRAM: 'y'

params:
  zcd_gpio:
    type: int
    required: true
    description: GPIO connected to the zero-cross detect output (one pulse per half-cycle)
  gate_gpio:
    type: int
    required: true
    description: GPIO connected to the triac gate driver
  ac_frequency_hz:
    type: int
    default: 50
    description: 50 Hz or 60 Hz mains

driver_params:
  power_param:      { type: bool, default: APP_DRIVER_PARAM_POWER }
  brightness_param: { type: u8, default: APP_DRIVER_PARAM_BRIGHTNESS }

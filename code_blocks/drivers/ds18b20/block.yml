description: Maxim DS18B20 1-Wire temperature probe. Real protocol via espressif/ds18b20. Depends on peripherals/onewire_bus.

# This block's slots are logic_*, so they land in app_logic/<concern>.cpp —
# app_LOGIC is the component that has to require the two components, not
# app_driver (which is where peripherals/onewire_bus's own slots land). Both
# headers are needed here: ds18b20.h for the probe, onewire_bus.h for the
# handle type and the device iterator. Authoring pitfall #2; unnoticed because
# no catalog product instantiated the block, so nothing ever compiled it.
cmake_priv_requires:
  app_logic: [espressif__ds18b20, espressif__onewire_bus]

params:
  poll_interval_ms: { type: int, default: 5000 }
  rescan_interval_ms:
    type: int
    default: 10000
    description: "While no probe is bound (none found at boot, or dropped after a run of failed reads), the bus is searched again this often (rounded to whole polls), so a probe plugged in or recovering later reports without a reboot"
  rebind_after_failures:
    type: int
    default: 3
    description: "Consecutive failed reads after which the probe handle is released and the bus searched again on the next poll"
  bus_handle_fn:
    type: string
    required: true
    description: "Name of the function that returns the onewire_bus_handle_t (e.g. ow_onewire_handle from peripherals/onewire_bus prefix=OW)"

driver_params:
  temp_param:
    type: i16
    required: true
    description: i16, hundredths of °C
  status_param:
    type: bool
    required: false
    description: "Optional sensor-health bool: true after a successful read, false after a failed one (or no probe). Without it a dead probe keeps its last reading on the bus."

facts:
  probe_late_or_lost: "A probe missing at boot, or one that stops answering for rebind_after_failures reads, is searched for again every rescan_interval_ms (10 s by default), so it reports again without a reboot; until it does, no temperature is published (the last reading stays) and status_param, if wired, reads false."

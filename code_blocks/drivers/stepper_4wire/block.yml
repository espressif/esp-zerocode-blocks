description: 4-wire unipolar stepper motor (28BYJ-48 with ULN2003 driver). 8-step half-step sequence.

# Drives 4 GPIOs in a half-step sequence. The position_param sets a target step
# count (signed). A periodic esp_timer (one half-step per step_delay_us) walks
# the actual position toward the target, then stops and de-energizes the coils.
# A step_delay_us below esp_timer's minimum period (~50 us) is raised to it, not refused.

cmake_priv_requires:
  app_driver: [esp_timer, esp_driver_gpio]

params:
  in1_gpio: { type: int, required: true }
  in2_gpio: { type: int, required: true }
  in3_gpio: { type: int, required: true }
  in4_gpio: { type: int, required: true }
  step_delay_us: { type: int, default: 1500, description: "Delay per half-step (smaller = faster)" }

driver_params:
  position_param:
    type: i16
    required: true
    description: i16 absolute target step (advanced/retreated by app code)

description: Aosong AHT21 / AHT20 I2C temp+humidity sensor (real protocol). Cheap alternative to SHT4x.

# Real AHT21 protocol:
#   - I2C addr 0x38
#   - 0xAC 0x33 0x00: trigger measurement
#   - Wait ~80 ms
#   - Read 6 bytes: status, hum_h, hum_m, mix, temp_m, temp_l
#     hum_raw  = (buf[1] << 12) | (buf[2] << 4) | (buf[3] >> 4)    /* 20-bit */
#     temp_raw = ((buf[3] & 0xF) << 16) | (buf[4] << 8) | buf[5]   /* 20-bit */
#     T_C = -50 + 200 * temp_raw / 0xFFFFF
#     RH  = 100 * hum_raw / 0xFFFFF

# This block TALKS on an I2C bus it does not configure: it attaches a device to
# whatever bus already exists on the port below (driver/i2c_master.h,
# i2c_master_get_bus_handle). Declared so the validator can check that
# assumption — without it a product composed with this sensor and no bus
# provider builds clean, links clean, boots, and is silent on the device with
# nothing in any report saying why. The provider may be an earlier
# peripherals/i2c_bus instance or a board that owns the port; this block cannot
# tell the two apart, which is the point. See engine/src/types.ts (BusDecl) and
# CLAUDE.md → Shared buses.

# esp_driver_i2c carries driver/i2c_master.h — see peripherals/i2c_bus.
cmake_priv_requires:
  app_logic: [esp_driver_i2c]

requires_bus:
  type: i2c
  port_param: i2c_port

params:
  i2c_freq_hz:
    type: int
    default: 100000
    description: >-
      SCL clock for THIS device, in Hz. The new I2C driver clocks each device
      rather than the bus, so two sensors sharing one bus may legitimately ask
      for different speeds.
  i2c_port: { type: int, default: 0 }
  i2c_address: { type: int, default: 0x38 }
  poll_interval_ms: { type: int, default: 5000 }

driver_params:
  temp_param: { type: i16, required: true, description: "i16, 0.01 °C" }
  humidity_param: { type: i16, required: true, description: "i16, 0.01 %RH" }
  status_param:
    type: bool
    required: false
    description: "Optional sensor-health bool: true after a successful read, false after a failed one. Displays and publishers gate 'no data' on it; without it a dead sensor keeps its last reading on the bus."

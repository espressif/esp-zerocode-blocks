description: "MFRC522 / RC522 13.56 MHz RFID card reader (MIFARE, NTAG, key fobs) on I2C (an I2C RC522 or WS1850S module; the common blue RC522 board is SPI — drivers/rfid_rc522_spi): card present / removed with the card's full UID (4, 7 or 10 bytes), through the maintained abobija/rc522 driver"

# The protocol — the anticollision cascade for 7- and 10-byte UIDs, I2C vs
# SPI register framing, the reader's RX/TX framing bits — is the library's,
# not the product's: each is easy to get wrong by hand (a 7-byte card read as
# 3 bytes, SPI framing sent over I2C, no card ever seen).
#
# Attaches to the bus a peripherals/i2c_bus (or the board) already owns on
# i2c_port. The library polls the reader on its
# own task and reports a card arriving and leaving; this block publishes that
# on the param bus and to product code (rfid_on_card), with the full UID.

singleton: true

cmake_priv_requires:
  app_logic: [abobija__rc522, esp_driver_i2c]

requires_bus:
  type: i2c
  port_param: i2c_port

params:
  i2c_port:
    type: int
    default: 0
    description: (I2C) the port of the bus it is on
  i2c_address:
    type: int
    default: 40
    description: (I2C) 7-bit address, decimal; 40 = 0x28, the usual RC522 I2C address
  rst_gpio:
    type: int
    default: -1
    description: The reader's RST pin, or -1 when not wired (a soft reset is used)
  poll_ms:
    type: int
    default: 125
    description: How often the reader is asked for a card, in ms

driver_params:
  present_param:
    type: bool
    required: false
    default: ""
    description: (Optional) true while a card is on the reader, false once it is taken away. Empty disables.
  card_param:
    type: u8
    required: false
    default: ""
    description: (Optional) FIRED with 1 each time a card arrives — an event, so the same card twice is two notifications. Empty disables.

facts:
  full_uid: "Product code gets each card's whole UID (4, 7 or 10 bytes) with rfid_on_card(cb, ctx): the callback runs when a card arrives (present true) and when it is taken away (present false, with that card's UID); the reader protocol, anticollision and I2C/SPI framing are the driver's, never the product's."
  bus: "It joins the I2C bus another block owns on i2c_port (address 0x28 by default); the common blue RC522 board is SPI, which is drivers/rfid_rc522_spi."

description: "ESP-NOW framework — devices talk DIRECTLY to each other: no router, no hub, no app. A ZeroCode remote drives a ZeroCode light out of the box; kits of separately-built products interoperate by shared param names."
# Chips this framework has been BUILT for (a real ESP-IDF build of a product
# using it). CI skips the framework on any other chip; the platform's
# registry must agree — see CLAUDE.md § Chips.
chips: [esp32, esp32c3, esp32c5, esp32c6, esp32s3, esp32s31]
# Needs a radio? true — a transport, a mesh, a BLE link or an internet
# connection is the point. On the ESP32-P4 the radio is a companion chip over
# ESP-Hosted; a product with no radio framework gets no hosted stack at all.
radio: true

# This is a "framework" block. The generator processes product.frameworks:
# [espnow] by loading it, copying its components/ subtree into the output,
# and rendering its main_includes / main_init slots into app_main.cpp.
#
# THE BINDING: "what does this device say to its peers." Controller device
# types (dimmer_remote, scene_button, …) populate espnow_emit_cases — param
# changes broadcast; actuator device types populate espnow_recv_cases —
# matching broadcasts drive the local param bus.
#
# KIT CONTRACT — names are the vocabulary: the wire format carries an
# FNV-1a hash of the param NAME string (APP_DRIVER_PARAM_POWER, …), not the
# numeric enum (enums are per-product). Two products interoperate when both
# sides cfg the SAME name — e.g. the remote's level_param and the light's
# brightness_param both set to APP_DRIVER_PARAM_BRIGHTNESS.
#
# TRUST MODEL, stated plainly. A device with NO stored peers is the open kit:
# broadcast frames, a one-byte group-id filter, NO encryption (ESP-NOW cannot
# encrypt broadcast) — fit for trusted spaces (a room, a booth, a workshop).
# PAIRING narrows it: open the window on both devices (zc_espnow_pair_start —
# behaviors/espnow_pair_trigger binds it to a button param; `espnow-pair` on
# the console), each stores the other in NVS, and from then on sends go
# unicast to the stored peers and frames from any other radio are dropped.
# Per-peer LMK encryption is the remaining step. All devices use Wi-Fi channel 1;
# this is also why the matrix blocks combining with router-bound transports
# (matter/rainmaker/mqtt): their AP dictates the channel and a kit's members
# could land on different channels.
#
# esp_now ships with ESP-IDF: no managed components. Every Wi-Fi chip.

# What the firmware already ships for pairing. The platform copies this into
# every espnow product's seed, so the spec names these commands instead of
# describing a pairing flow the writer would then build again.
onboarding:
  console:
    commands:
      - "espnow-pair [seconds] — open the pairing window (default 30 s); run it on both devices at once, and each stores the other"
      - "espnow-peers — list the paired devices"
      - "espnow-forget — forget every paired device, back to the open broadcast kit"
    api: "zc_espnow_pair_start, zc_espnow_pairing, zc_espnow_peer_count, zc_espnow_forget_peers (app_espnow.h); behaviors/espnow_pair_trigger binds the pairing window to a button"
    note: "Unpaired devices are an open kit: broadcast, unencrypted, for a trusted space. Paired devices talk only to each other, and the pairing is kept across reboots."

# What the framework gives the owner and cannot do, in words a spec can
# promise. Copied into every product's seed.
facts:
  role: "Devices talk to each other directly over the radio and never join a Wi-Fi network, so there is no internet, phone app, web page or network time."
  what_talks: "In the catalog a dimmer remote sends on/off and a brightness level, a scene button sends a scene number, and a light, dimmable light or smart plug obeys on/off (a dimmable light also brightness); no catalog device obeys a scene number."
  state_not_toggle: "A remote sends the on/off state and level it holds itself, never \"toggle\" or \"brighter\", so a light changed some other way can disagree with the remote until the remote is used again."
  missed_messages: "A message goes out once, when the control changes: a device that is off or out of range then misses it and is not told later, and the sender never learns whether it arrived."
  limits: "A device remembers at most 8 paired devices, and messages are not encrypted, paired or not."
  one_channel: "Every device uses the same fixed radio channel and group, so two unpaired kits in range of each other control each other's devices; only pairing keeps them apart."
  reset: "A factory reset forgets every paired device and returns it to the open kit."

description: Matter protocol — esp_matter SDK, on/off + lighting + sensor + thermostat clusters
# Chips this framework has been BUILT for (a real ESP-IDF build of a product
# using it). CI skips the framework on any other chip; the platform's
# registry must agree — see CLAUDE.md § Chips.
chips: [esp32, esp32c3, esp32c5, esp32c6, esp32h2, esp32s3, esp32s31]
# Needs a radio? true — a transport, a mesh, a BLE link or an internet
# connection is the point. On the ESP32-P4 the radio is a companion chip over
# ESP-Hosted; a product with no radio framework gets no hosted stack at all.
radio: true
# Behaviors every Matter product gets unless it lists or excludes them.
defaults:
  - behaviors/ota_basic
  - behaviors/network_status_log
  - behaviors/uptime_log
  - behaviors/wifi_disconnect_recovery

# This is a "framework" block. The generator processes product.frameworks: [matter, ...]
# by loading each framework block, copying its components/ subtree into the output,
# and rendering its main_includes / main_init slots into main/app_main.cpp.
#
# Device-type blocks (device_types/*) populate the matter_includes / matter_statics /
# matter_endpoint_create / matter_*_cases slots that get rendered into
# components/app_matter/app_matter.cpp (whose source lives under
# frameworks/matter/components/app_matter/).

# What the framework gives the owner and cannot do, in words a spec can
# promise. Copied into every product's seed.
facts:
  pairing: "The device is added over Bluetooth from any Matter app, and the app gives it the home's Wi-Fi (or Thread) network during setup, so nothing about the network is set on the device itself."
  setup_code: "Every device uses the same development setup code (passcode 20202021, discriminator 3840): the device never prints it, the studio's flash page shows it, and Matter apps warn that it is an uncertified test device."
  pairing_window: "An unpaired device can be added for 15 minutes after it powers up; after that, unplug it and plug it back in to try again."
  controllers: "One device can be in up to 5 Matter apps or hubs at the same time."
  reset: "Removing the device from its last Matter app returns it to factory state, ready to pair again; the framework adds no reset button of its own."
  network: "It runs on Wi-Fi; it uses Thread only on an ESP32-H2 (always) or on a C5/C6 when Thread is chosen, and then the home needs a Thread border router."
  switches: "A Matter switch, dimmer remote or scene button shows up in the app but does not control other Matter devices out of the box."

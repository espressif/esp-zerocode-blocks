description: "MQTT framework — connects to any MQTT broker over Wi-Fi and announces every device via Home Assistant discovery. Works with Home Assistant, Mosquitto, or any MQTT 3.1.1 broker; no hub protocol, no cloud. Onboarding is included: a guided `mqtt-setup` console command asks for Wi-Fi and the broker (plus mqtt-wifi / mqtt-broker, and public setters app_mqtt_set_* for a custom flow)."
# Chips this framework has been BUILT for (a real ESP-IDF build of a product
# using it). CI skips the framework on any other chip; the platform's
# registry must agree — see CLAUDE.md § Chips.
chips: [esp32, esp32c3, esp32c5, esp32c6, esp32s3, esp32s31]
# Needs a radio? true — a transport, a mesh, a BLE link or an internet
# connection is the point. On the ESP32-P4 the radio is a companion chip over
# ESP-Hosted; a product with no radio framework gets no hosted stack at all.
radio: true

# This is a "framework" block. The generator processes product.frameworks:
# [mqtt] by loading it, copying its components/ subtree into the output, and
# rendering its main_includes / main_init slots into app_main.cpp.
#
# Device-type blocks populate mqtt_includes / mqtt_statics /
# mqtt_device_create / mqtt_command_cases / mqtt_driver_cb_cases, rendered
# into components/app_mqtt/app_mqtt.cpp (stub under
# frameworks/mqtt/components/app_mqtt/).
#
# The binding is Home Assistant MQTT discovery: each device-type instance
# publishes a retained discovery config (homeassistant/<component>/…/config),
# subscribes its command topic, publishes its state topic. Availability rides
# a Last-Will topic, so HA shows the device offline once the broker's keep-alive gives up on it.
# A behavior that sleeps (behaviors/deep_sleep_cycle) hooks in through
# mqtt_statics / mqtt_event_cases: it waits for the outbox to empty, then stops
# the client, whose clean DISCONNECT means the broker never sends the will.
#
# ONBOARDING IS THE CONSOLE, deliberately. Unlike RainMaker (phone app) or
# Matter (QR commissioning), a bare MQTT node has no companion app, so v1
# configures over the serial console and persists to NVS:
#     mqtt-setup                                  GUIDED: asks for both below
#     mqtt-wifi <ssid> <password>
#     mqtt-broker <uri> [username] [password]     e.g. mqtt://192.168.1.10
# Boot without config MUST still reach "ZeroCode AI firmware started" (the
# framework logs "not configured" and idles — never blocks app_main).
#
# TOPIC SHAPE (node id = station MAC, lowercase hex):
#     zerocode/<node>/status              online/offline (retained + LWT)
#     zerocode/<node>/<instance>/state    device state (retained)
#     zerocode/<node>/<instance>/set      commands to the device
#
# NO {{ }} IN DISCOVERY PAYLOADS: Home Assistant value_template syntax is
# jinja ({{ value }}), which collides with THIS template engine — a literal
# {{ in a slot file throws at generation. Publish plain values instead;
# HA parses bare numbers and ON/OFF without templates.
#
# esp-mqtt + esp_wifi ship with ESP-IDF — no managed components, no extra
# sdkconfig, and it runs on every Wi-Fi chip. Also the first framework the
# EMULATOR can verify end-to-end (esp-emu --net user reaches a real broker).

# WHAT THE FIRMWARE ALREADY SHIPS FOR FIRST-RUN ONBOARDING — see the same
# section in frameworks/aws_iot/block.yml. The commands are engine-generated
# (genAppMqttCpp); scripts/check.py looks for them there.
onboarding:
  console:
    setup: "mqtt-setup — guided: asks for Wi-Fi, then the broker URI and its credentials"
    commands:
      - "mqtt-wifi <ssid> <password>"
      - "mqtt-broker <uri> [username] [password]"
    api: "app_mqtt_set_wifi, app_mqtt_set_broker, app_mqtt_configured (app_mqtt.h); app_console_read_line (app_console.h)"
    note: "Beside Matter or RainMaker, Wi-Fi is onboarded through them: mqtt-wifi does not exist and mqtt-setup asks for the broker only."

# What the framework gives the owner and cannot do, in words a spec can
# promise. Copied into every product's seed.
facts:
  in_the_app: "Home Assistant finds it by itself and shows one device, named \"ZeroCode\" plus the board's 12-character hardware address, with one entity per device type, named by the label the spec gives it."
  entity_kinds: "Each catalog device type appears in Home Assistant as a light, switch, fan, cover, lock, climate, sensor, binary sensor, number or select; a dimmer remote or scene button appears only as triggers for automations, with no state of its own."
  not_announced: "A device type with no MQTT binding (doorbell, chime, light sensor, pressure sensor, heat pump, extractor hood and a few controller types) does not appear in Home Assistant."
  offline: "When it loses power, Wi-Fi or the broker, Home Assistant marks it unavailable only once the broker's keep-alive gives up on it, not the moment it drops; a device that sleeps looks exactly like one that lost power, unless it signs off before sleeping, as behaviors/deep_sleep_cycle does."
  reconnect: "It reconnects to Wi-Fi and the broker by itself, marks itself available again and re-sends each entity's current state, so changes made while it was offline arrive as the latest value, not one by one."
  reset: "A factory reset erases the Wi-Fi and broker settings, so setup runs again, but the device keeps its name and entities in Home Assistant because they come from its hardware address."

description: "BLE HID framework — the device IS a Bluetooth remote: it pairs with a phone/PC/TV as a media controller and SENDS consumer-control commands (play/pause, volume, mute). The home for controller device types nothing else can serve."
# Chips this framework has been BUILT for (a real ESP-IDF build of a product
# using it). CI skips the framework on any other chip; the platform's
# registry must agree — see CLAUDE.md § Chips.
chips: [esp32, esp32c3, esp32c5, esp32c6, esp32h2, esp32s3, esp32s31]
# Needs a radio? true — a transport, a mesh, a BLE link or an internet
# connection is the point. On the ESP32-P4 the radio is a companion chip over
# ESP-Hosted; a product with no radio framework gets no hosted stack at all.
radio: true

# This is a "framework" block. The generator processes product.frameworks:
# [ble_hid] by loading it, copying its components/ subtree into the output,
# and rendering its main_includes / main_init slots into app_main.cpp.
#
# THE BINDING INVERTS THE OTHER WAY: transports answer "how does this device
# appear on a network", voice answers "what do you say to it" — BLE HID
# answers "what does this device SEND". Controller device types
# (scene_button, dimmer_remote — the ones absent from voice and awkward in
# RainMaker, because they're inputs) map param-bus changes to HID consumer
# usages via ble_hid_driver_cb_cases, using the generated helper
# zc_ble_hid_send_consumer(usage) (press + release, report id 1).
#
# Stack: NimBLE (matches base_firmware's host — no Bluedroid switch that
# would fight Matter's config) + IDF's esp_hid component, HID-over-GATT.
# The GAP/advertising/security boilerplate lives in this component's
# ble_hid_gap.c (adapted, BLE-only, from the IDF esp_hid_device example) so
# the generated app_ble_hid.cpp stays small. Pairing is Just Works (a remote
# has no screen for a passkey); bonds persist in NVS; on disconnect the
# device re-advertises.
#
# Chips: every BLE chip. esp32s2 has no Bluetooth, but it isn't in the
# catalog matrix anyway.

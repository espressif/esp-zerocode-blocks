description: "AWS IoT Core connectivity — brings up the network and holds one mutual-TLS MQTT session to your own AWS account, which any task can publish and subscribe on. The device's AWS identity (endpoint, thing name, certificate, key, optional root CA) is device data the flash page asks for; Wi-Fi is onboarded over the console with a guided `aws-setup` (or `aws-wifi`, or app_aws_iot_set_wifi for a custom flow). A presence topic is app_aws_iot_set_will (an MQTT last will whose topic may contain {thing}) plus app_aws_iot_publish_retained for its \"online\". Connectivity only: what gets published is the application's business."
# Chips this framework has been BUILT for (a real ESP-IDF build of a product
# using it). CI skips the framework on any other chip; the platform's
# registry must agree — see CLAUDE.md § Chips.
#
# Every Wi-Fi chip in chips.txt, each proven by a real link of aws-iot-conn-demo
# on ESP-IDF 6.x.
#
# NOT esp32h2: no Wi-Fi. NOT esp32p4: esp-aws-iot does not list it, and the
# P4's radio is a companion chip over ESP-Hosted.
chips: [esp32, esp32c3, esp32c5, esp32c6, esp32s3, esp32s31]
# Needs a radio? true — an internet connection is the entire point.
radio: true

# THIS BLOCK IS A PIPE, NOT A DEVICE MODEL.
#
# It owns the network and one MQTT session, and exposes publish/subscribe plus
# the coreMQTT-Agent handle (app_aws_iot.h). It knows nothing about device
# types, params or shadows. How a device is REPRESENTED in a cloud is not
# connectivity, and is deliberately somebody else's block.
#
# JSON IS ON THE PATH, THOUGH. Every AWS IoT payload is JSON, and when this
# block shipped no library for it every writer added one — cJSON, 24 times in
# six weeks — which is now deprecated upstream (unmaintained, open security
# reports). idf_component.yml therefore carries espressif/json_parser (read:
# json_parse_start / json_obj_get_*) and espressif/json_generator (write into
# a caller-owned buffer: json_gen_str_start / json_gen_obj_set_*), both RFC
# 8259, and requires.cmake puts them on app_logic's and main's path.
# behaviors/aws_iot_heartbeat is the worked example of both directions.
#
# Because of that it needs NO codegen: like frameworks/ml and frameworks/lm it
# is a pure copy-in framework — components/ plus requires.cmake plus the two
# main_* slots, and not one line in engine/src/generator.ts.
#
# WHY coreMQTT AND NOT esp-mqtt. For a bare pipe esp-mqtt would do; it speaks
# mutual TLS too. The difference is what ATTACHES to the session: Device Shadow,
# Jobs, OTA over MQTT file streams, Fleet Provisioning and Device Defender are
# all written against coreMQTT and expect to join an existing session. That is
# why app_aws_iot_agent() is public.
#
# WHY coreMQTT-Agent. MQTTContext_t is not thread-safe and one task must own it.
# The agent is the queue in front of that task, so any task may publish without
# knowing it. Measured on esp32c6: 7,136 B flash, 529 B bss, one task.
#
# SUBSCRIPTIONS ARE DECLARATIVE. app_aws_iot_subscribe() records the filter and
# the block replays every registration whenever the broker reports no session.
# An imperative subscribe would work until the first network blip and then go
# silently deaf — a failure generated code cannot see and will never debug.
#
# THE SDK IS FETCHED, NOT VENDORED. components/coreMQTT/CMakeLists.txt clones
# espressif/esp-aws-iot at a pinned commit into ../third_party and registers the
# sources itself; coreMQTT-Agent, backoffAlgorithm and posix_compat come from
# the component manager (see idf_component.yml). Set ZC_AWS_IOT_SRC in the
# ENVIRONMENT to build against a pre-cloned tree — see the block README for why
# it must be the environment and not -D.
#
# ONBOARDING: THE IDENTITY AT FLASH TIME, WI-FI OVER THE CONSOLE. An AWS IoT
# thing has no commissioning protocol. The platform's flash page asks for the
# keys under device_data: below and writes them into the fctry partition
# (namespace "zc_aws"); the framework reads them once, at init, and nothing on
# the device changes them — a new identity is a reflash with device data. Wi-Fi
# is the console's, persisted in the default NVS partition (namespace "zc_aws"):
#     aws-setup                      GUIDED: asks for the network and password
#     aws-wifi <ssid> <password>
#     aws-status
#     aws-inject <topic> <payload>   TESTING: delivers the message to this
#                                    device's own subscribers as if the broker
#                                    had sent it — no session needed. The one way
#                                    to exercise a command handler (JSON parse,
#                                    apply, state echo) on the emulator or a
#                                    bench with no AWS account yet.
# Boot without config MUST still reach "ZeroCode AI firmware started" (the
# framework logs "not configured" and idles — never blocks app_main), which is
# also what lets CI build a product for this framework with no AWS account.
#
# THE WI-FI STORAGE IS PUBLIC API, the commands are wrappers:
# app_aws_iot_set_wifi, _configured and _owns_wifi in app_aws_iot.h, and the
# console's line reader app_console_read_line. A product whose spec wants a
# different flow writes a console command over them, never a copy of the NVS
# layout.
#
# THE LAST WILL is public too: app_aws_iot_set_will(topic, payload, qos, retain),
# where "{thing}" in the topic is substituted at every connect, plus
# app_aws_iot_publish_retained for the retained "online" that a retained will
# needs. Verified against a TLS listener: the CONNECT carries the substituted
# will, and "online" arrives retained.
#
# Amazon Root CA 1 is compiled in; a flashed `rootca` overrides it for a
# private endpoint. mbedTLS's outbound record buffer is cut to 4 KB in the
# sidecar sdkconfig.defaults — AWS never needs 16 KB in that direction, and it
# is ~12 KB of heap back.

# WHAT THE FIRMWARE ALREADY SHIPS FOR FIRST-RUN ONBOARDING — data, read by the
# platform: it copies `onboarding` into every product's details seed, so the
# spec names this setup instead of describing a flow the firmware would then
# have to be built to match. scripts/check.py fails a command listed here that
# the block (or the engine) does not register.
onboarding:
  console:
    setup: "aws-setup — guided: asks for the Wi-Fi network and password, then says whether the flashed identity is complete"
    commands:
      - "aws-wifi <ssid> <password>"
      - "aws-status"
      - "aws-inject <topic> <payload> (testing: delivers the message to the device's own subscribers as if the broker sent it; works offline — quote a JSON payload)"
    api: "app_aws_iot_set_wifi, app_aws_iot_configured, app_aws_iot_owns_wifi (app_aws_iot.h); app_console_read_line (app_console.h)"
    note: "Beside Matter or RainMaker, Wi-Fi is onboarded through them: aws-wifi and the setup's Wi-Fi step do not apply."
  flash: "The flash page asks for the endpoint, thing name, certificate, private key and optional root CA and writes them to the device with the firmware. There is no console command or setter for them: a new identity is a reflash with device data. Wi-Fi comes from aws-setup / aws-wifi (or the transport that owns it)."

# The per-device identity the flash page asks for, written into the fctry
# partition under zc_aws (see ONBOARDING above). The PEMs are stored as the
# file's bytes with no NUL; the loader adds one.
device_data:
  namespace: zc_aws
  keys:
    - key: endpoint
      encoding: string
      label: AWS IoT endpoint
    - key: port
      encoding: i32
      default: 8883
      label: MQTT port
      required: false
    - key: thing
      encoding: string
      label: Thing name
    - key: cert
      type: file
      encoding: binary
      label: Device certificate (PEM)
    - key: key
      type: file
      encoding: binary
      label: Private key (PEM)
    - key: rootca
      type: file
      encoding: binary
      label: Root CA (PEM)
      required: false

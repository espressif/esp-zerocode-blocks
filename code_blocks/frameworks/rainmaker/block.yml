description: ESP RainMaker protocol — cloud-connected node, phone-app provisioning (BLE/SoftAP)
# Chips this framework has been BUILT for (a real ESP-IDF build of a product
# using it). CI skips the framework on any other chip; the platform's
# registry must agree — see CLAUDE.md § Chips.
chips: [esp32, esp32c3, esp32c5, esp32c6, esp32s3, esp32s31]
# Needs a radio? true — a transport, a mesh, a BLE link or an internet
# connection is the point. On the ESP32-P4 the radio is a companion chip over
# ESP-Hosted; a product with no radio framework gets no hosted stack at all.
radio: true
provides_internet: true

# This is a "framework" block. The generator processes product.frameworks:
# [rainmaker, ...] by loading it, copying its components/ subtree into the
# output, and rendering its main_includes / main_init slots into app_main.cpp.
#
# Device-type blocks (device_types/*) populate the rainmaker_includes /
# rainmaker_statics / rainmaker_device_create / rainmaker_*_cases slots that
# get rendered into components/app_rainmaker/app_rainmaker.cpp (whose stub
# source lives under frameworks/rainmaker/components/app_rainmaker/).
#
# NOTE: self-claiming (CONFIG_ESP_RMAKER_SELF_CLAIM) stores claim data in the
# factory NVS partition ("fctry"). The 4mb and 8mb partition-table blocks
# carry one; 2mb does not (no room, and no RainMaker-supported chip is
# 2MB-only) — pick 4mb or 8mb for RainMaker products.

# What the framework gives the owner and cannot do, in words a spec can
# promise. Copied into every product's seed.
facts:
  pairing: "The device is set up from the ESP RainMaker phone app over Bluetooth, by scanning a QR code the device prints on its serial console at first boot; the code carries a one-time secret, and 5 wrong attempts stop setup."
  pairing_window: "If the device is not set up within 30 minutes of powering up, setup stops until it is restarted."
  cloud_identity: "No certificate or cloud account is prepared by hand: the device gets its own cloud identity during setup."
  in_the_app: "Each part of the product (light, plug, sensor…) appears as its own tile named after its label, renameable in the app; switches, remotes and scene buttons have no RainMaker form and do not appear."
  offline: "The app reaches the device only through the RainMaker cloud (no local control, schedules or scenes), so app control needs internet, while the device's own buttons and rules keep working offline."
  time: "Once online, the device knows the real time of day."
  restored_state: "A device's on/off shown in the app is restored and applied again at power-up, so the last command repeats after a power cut; a momentary action from the app (a door-opener press, a feed) is a setting tile of the product's own instead, which is never replayed."
  own_settings: "The product's own settings and readings — a mode switch, a limit, a time of day for a schedule (shown as HH:MM text) — can each appear in the app as a tile of their own; a value set there is kept by the product, and nothing set in the app is replayed by itself at the next power-up."
  reset: "A wrong Wi-Fi password during setup sends the device back to waiting for setup after 3 tries; the framework adds no reset, so moving to another Wi-Fi or account needs a reset added to the product (a button or a power-cycle pattern)."

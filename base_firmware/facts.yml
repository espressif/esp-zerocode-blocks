# What every product's firmware gives the owner, whatever its frameworks —
# copied into each product's seed (`firmwareFacts`) so a spec states it
# instead of inventing a way to do it. One sentence each; check.py validates
# the shape and that the console commands named here are registered.
facts:
  console: "Every product has a serial console over its USB port with three built-in commands: `reboot`, `mem` (free memory) and `factory_reset` (erases every saved setting — Wi-Fi, pairing, calibration — and reboots)."
  reset_controls: "A factory reset WITHOUT the console is not built in; when the owner wants one, it is one of three catalog behaviours — hold a button for a few seconds (factory_reset_long_press), hold two buttons together (factory_reset_button_combo), or power it off and on several times quickly (factory_reset_power_cycle, for a sealed device)."
  factory_reset_hook: "To clear more on a factory reset (the product's own NVS namespaces or partitions, such as values loaded from the fctry partition), product code defines void app_factory_reset_hook(void) (app_utils.h) in a file under components/app_logic: every factory reset, console or button or power cycle, runs it before erasing. A product never registers another factory_reset command."
  factory_reset_hold_feedback: "For feedback while a factory-reset button is held (an LED full blue, then normal if released early), product code defines void app_factory_reset_hold_started(void) and void app_factory_reset_hold_cancelled(void) (app_utils.h) in components/app_logic; it never unregisters or re-registers the button block's callbacks, so its short press and its reset keep working."
  param_unchanged_write: "app_driver_set_param of the value a param already holds is not notified, so a steady reading looks like a dead sensor: to know a sensor is alive, read its driver's status param (e.g. ds18b20 status_param) or app_driver_param_written_us(id) (esp_timer time of its last write, unchanged ones included), never value changes."
  instance_frameworks: "A composed device type is this device on EVERY selected framework: a light composed only to draw a card on the screen or the web page is also announced to Matter, Home Assistant or RainMaker as a light the device is. To keep an instance to some frameworks, give it frameworks: [display] (or [webui], …) in template.yaml beside block, prefix and cfg."
  param_guard: "A listener cannot refuse a write: the hardware switched before it is told. An interlock (E-stop, allowed hours, never heat mid-cook, a range) is app_driver_set_guard(param, fn, ctx) from app_logic_init(): fn sees the value before it is committed or applied, returns false to refuse or clamps *val; a refused write returns ESP_ERR_NOT_ALLOWED and its source is told the real value."
  param_listener_task: "A param listener runs on the task that wrote the param (sensor poll, MQTT, web server, console, Matter), so listeners run at the same time: a product decision that reads several params and writes one must run through app_driver_run_serialized(decide, arg) from the listener, never in it and never under a product mutex held across app_driver_set_param (deadlocks with Matter/LVGL)."
  product_build_dependencies: "To give product code in components/app_logic another component (esp_http_client, json, …), list it in components/app_logic/product.cmake as set(PRODUCT_PRIV_REQUIRES <component> …); never edit the generated app_logic/CMakeLists.txt, which generating the tree rewrites (the engine never writes product.cmake)."
  product_params: "A param only product code uses (a setpoint, a mode, a counter) is declared in template.yaml params:, name to type (params: { APP_DRIVER_PARAM_SETPOINT: i16 }; types bool/u8/i16/u16/u32, a fraction scaled, e.g. tenths in i16); it joins the param enum like any block param. Never #define, #undef or redefine APP_DRIVER_PARAM_* or APP_DRIVER_PARAM_MAX in product code."
console_commands: [reboot, mem, factory_reset]
